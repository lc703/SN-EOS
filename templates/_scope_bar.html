{% load sn %}<div class="flex-1 min-w-0 flex items-center gap-2 overflow-x-auto no-scrollbar text-[13px]">
  <div class="seg shrink-0" role="tablist" aria-label="Team">
    {% for t in all_teams %}
      <a href="?team={{ t.slug }}" class="{% if team and t.pk == team.pk %}on{% endif %}" role="tab">{{ t.name }}</a>
    {% endfor %}
  </div>
  <form method="get" hx-boost="false" class="shrink-0 ml-auto sm:ml-0">
    <label class="sr-only" for="quarter-pick">Quarter</label>
    <select id="quarter-pick" name="quarter" onchange="this.form.submit()" class="h-8 rounded-lg border border-black/10 bg-white pl-2.5 pr-7 text-[13px] font-semibold">
      {% for q in all_quarters %}<option value="{{ q.pk }}" {% if quarter and q.pk == quarter.pk %}selected{% endif %}>{{ q.name }}{% if q.is_current %} · now{% endif %}</option>{% endfor %}
    </select>
  </form>
</div>
