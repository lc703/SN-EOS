<span class="strip" aria-label="13-week status">{% for w, u, future in strip %}<span class="{% if u %}s-{{ u.rag }}{% elif future %}s-future{% else %}s-none{% endif %}{% if w == now %} s-now{% endif %}" title="Week of {{ w|date:'M j' }}{% if u %}: {{ u.get_rag_display }}{% if u.note %} — {{ u.note|truncatechars:80 }}{% endif %}{% elif not future %}: no update{% endif %}"></span>{% endfor %}</span>
