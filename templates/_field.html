{% if field.is_hidden %}{{ field }}{% else %}
<div class="{{ wrap|default:'' }}">
  {% if field.widget_type == 'checkbox' %}
    <label class="flex items-center gap-2 text-sm font-medium">{{ field }} {{ field.label }}</label>
  {% else %}
    <label for="{{ field.id_for_label }}" class="block text-[13px] font-semibold text-neutral-700 mb-1">{{ field.label }}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="mt-1 text-xs text-neutral-500">{{ field.help_text }}</p>{% endif %}
  {% for e in field.errors %}<p class="mt-1 text-xs text-red-700">{{ e }}</p>{% endfor %}
</div>
{% endif %}
