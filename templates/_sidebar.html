{% load static sn %}

  <span class="leading-tight"><span class="block font-display font-extrabold text-[15px] tracking-tight">{{ APP_NAME }}</span><span class="block text-[10.5px] uppercase tracking-[.18em] text-neutral-500 font-semibold">{{ COMPANY_NAME }}</span></span>
</a>
<nav class="flex-1 overflow-y-auto px-3 pb-4 space-y-0.5">{% include "_nav_links.html" %}</nav>
