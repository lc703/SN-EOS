<input name="name" value="{{ p.name|default:'' }}" required placeholder="e.g. Order to delivery" class="block w-full rounded-lg border bg-white px-3 h-9 text-sm" aria-label="Process name">
<select name="owner" class="block w-full rounded-lg border bg-white px-2 h-9 text-sm" aria-label="Owner"><option value="">No owner</option>{% for u in people %}<option value="{{ u.pk }}" {% if p.owner_id == u.pk %}selected{% endif %}>{{ u.display_name }}</option>{% endfor %}</select>
<textarea name="steps" rows="3" placeholder="Major steps, one per line" class="block w-full rounded-lg border bg-white px-3 py-2 text-sm" aria-label="Steps">{{ p.steps|default:'' }}</textarea>
<div class="flex gap-4 text-sm"><label class="flex items-center gap-1.5"><input type="checkbox" name="documented" value="1" {% if p.documented %}checked{% endif %}> Documented</label><label class="flex items-center gap-1.5"><input type="checkbox" name="followed_by_all" value="1" {% if p.followed_by_all %}checked{% endif %}> Followed by all</label></div>
