<tr id="m-{{ row.measurable.pk }}" data-id="{{ row.measurable.pk }}" class="list-row"
    hx-vals='{"cols": "{{ cols }}", "mode": "{{ mode }}", "meeting": "{{ meeting_id|default:"" }}", "trailing": "{% if show_trailing %}1{% endif %}", "trend": "{% if show_trend %}1{% endif %}"}'>
  {% include "scorecard/_title_cell.html" %}
  <td class="px-2 py-1 text-center whitespace-nowrap text-neutral-600 font-medium">{{ row.measurable.goal_display }}</td>
  {% if show_trend %}{% include "scorecard/_trend_cell.html" %}{% endif %}
  {% for c in row.cells %}{% include "scorecard/_cell.html" %}{% endfor %}
  {% if show_trailing %}{% include "scorecard/_trail_cell.html" %}{% endif %}
</tr>
