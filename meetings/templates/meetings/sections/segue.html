<div class="grid md:grid-cols-[1fr_18rem] gap-5 items-start">
  <form method="post" action="{% url 'meeting_update' meeting.pk %}" class="card card-pad">{% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <p class="text-sm text-neutral-600 mb-2">Everyone shares one personal and one professional best from the past week.</p>
    <textarea name="segue_notes" rows="8" class="block w-full rounded-lg border bg-white px-3 py-2 text-[14.5px]" placeholder="Good news…" {% if not can_run %}disabled{% endif %}>{{ meeting.segue_notes }}</textarea>
    {% if can_run %}<div class="mt-3 flex justify-end"><button class="btn btn-primary">Save notes</button></div>{% endif %}
  </form>
  <form method="post" action="{% url 'meeting_update' meeting.pk %}" class="card card-pad">{% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}"><input type="hidden" name="attendees_present" value="1">
    <div class="eyebrow mb-2">Attendees</div>
    <div class="space-y-1.5">
      {% for m in members %}
        <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="attendees" value="{{ m.pk }}" class="h-4 w-4" {% if m.pk in attendee_ids %}checked{% endif %} {% if can_run %}onchange="this.form.requestSubmit()"{% else %}disabled{% endif %}> {{ m.display_name }}</label>
      {% endfor %}
    </div>
    {% if can_run and others %}
      <label class="mt-3 block text-xs text-neutral-500" for="add-attendee">Add someone else</label>
      <select id="add-attendee" name="add_attendee" onchange="this.form.requestSubmit()" class="mt-1 block w-full rounded-lg border bg-white px-2 py-1.5 text-sm">
        <option value="">Choose a person…</option>
        {% for o in others %}<option value="{{ o.pk }}">{{ o.display_name }}</option>{% endfor %}
      </select>
    {% endif %}
    <p class="mt-3 text-xs text-neutral-500">This meeting shows only items owned by the people checked here.</p>
  </form>
</div>
