{% load sn %}
<div class="grid md:grid-cols-[1fr_19rem] gap-5 items-start">
  <form class="card card-pad" {% if can_run %}hx-post="{% url 'meeting_update' meeting.pk %}" hx-trigger="autosave" hx-swap="none" data-autosave{% endif %}>{% csrf_token %}
    <div class="flex items-center justify-between mb-2"><label for="segue" class="section-title">Good news</label>{% if can_run %}<span class="text-xs text-neutral-400">Saves as you type</span>{% endif %}</div>
    <textarea id="segue" name="segue_notes" rows="9" class="input !h-auto py-2.5 leading-relaxed" placeholder="Ben: great harvest weekend&#10;Maria: Ohio dealer signed" {% if not can_run %}disabled{% endif %}>{{ meeting.segue_notes }}</textarea>
  </form>
  <form class="card card-pad" {% if can_run %}hx-post="{% url 'meeting_update' meeting.pk %}" hx-trigger="change" hx-swap="none"{% endif %}>{% csrf_token %}
    <input type="hidden" name="attendees_present" value="1">
    <div class="flex items-center justify-between mb-3"><span class="section-title">Who's here</span><span class="text-xs text-neutral-500">{{ attendee_ids|length }} of {{ members|length }}</span></div>
    <div class="flex flex-wrap gap-2">
      {% for m in members %}
        <label class="chip-toggle"><input type="checkbox" name="attendees" value="{{ m.pk }}" class="sr-only" {% if m.pk in attendee_ids %}checked{% endif %} {% if not can_run %}disabled{% endif %}>{% avatar m "sm" %}{{ m.first|default:m.display_name }}</label>
      {% endfor %}
    </div>
    <p class="mt-3 text-xs text-neutral-500">Attendees rate the meeting at Conclude and get the recap.</p>
  </form>
</div>
