{# Guided empty state. Params: title, text, cta_url, cta_label, panel (open CTA in side panel), icon (svg path d) #}
<div class="empty">
  <span class="empty-icon"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ icon|default:'M12 5v14M5 12h14' }}"/></svg></span>
  <h3>{{ title }}</h3>
  {% if text %}<p>{{ text }}</p>{% endif %}
  {% if cta_url %}<a href="{{ cta_url }}" {% if panel %}data-panel{% endif %} class="btn btn-primary mt-4">{{ cta_label }}</a>{% endif %}
</div>
