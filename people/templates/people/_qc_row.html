{% load sn %}
<form class="qc-row group px-4 py-3 grid grid-cols-1 md:grid-cols-[1fr_auto] gap-x-4 gap-y-2 items-center" hx-post="{% url 'qc_score' o.pk %}" hx-swap="none">{% csrf_token %}
  <input type="hidden" name="kind" value="{{ kind }}"><input type="hidden" name="ref" value="{{ item.pk }}">
  <div class="min-w-0 flex items-start gap-2">
    <div class="min-w-0 flex-1">
      <div class="text-sm font-semibold leading-snug">{{ label }}</div>
      {% if sub %}<div class="text-xs text-neutral-500 truncate">{{ sub }}</div>{% endif %}
    </div>
    {% if kind == 'ss' and can_edit_statements %}<button type="button" class="btn btn-ghost btn-sm !px-1.5 opacity-0 group-hover:opacity-100 qc-del" hx-post="{% url 'statement_delete' item.pk %}" hx-confirm="Remove this success statement?" aria-label="Remove">{% icon "x" "h-3.5 w-3.5" %}</button>{% endif %}
  </div>
  <div class="flex items-center gap-3">
    <span class="w-10 text-center" title="{% if last %}Last time: {{ last.rag|default:'not scored' }}{% else %}No previous score{% endif %}">
      {% if last and last.rag %}<span class="inline-block h-2.5 w-2.5 rounded-full dot-{{ last.rag }}"></span>{% else %}<span class="text-neutral-300 text-xs">—</span>{% endif %}
    </span>
    <div class="flex gap-1" role="group" aria-label="Score for {{ label }}">
      {% for val, short in rag_choices %}<button name="rag" value="{{ val }}" class="rag-btn rag-btn-{{ val }} {% if score.rag == val %}on{% endif %}" title="{{ val|title }}">{{ short }}</button>{% endfor %}
    </div>
  </div>
  <input name="note" value="{{ score.note }}" hx-post="{% url 'qc_score' o.pk %}" hx-trigger="change" hx-include="closest form" hx-swap="none" class="input input-sm md:col-span-2 {% if score.rag == 'red' and not score.note %}!border-[var(--red)]{% endif %}" placeholder="{% if score.rag == 'red' %}What's the plan?{% else %}Note (optional){% endif %}" aria-label="Note for {{ label }}">
</form>
