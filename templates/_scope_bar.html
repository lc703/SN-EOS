<div class="bg-white border-b border-black/[.06] print:hidden">
  <div class="{% if wide %}max-w-screen-2xl{% else %}max-w-6xl{% endif %} mx-auto px-4 h-11 flex items-center gap-3 overflow-x-auto text-[13px]">
    {% if not hide_team_scope %}
    <span class="eyebrow shrink-0 hidden sm:inline">Team</span>
    <div class="flex items-center gap-1 shrink-0">
      {% for t in all_teams %}
        <a href="?team={{ t.slug }}" class="h-7 px-3 inline-flex items-center rounded-full font-medium whitespace-nowrap {% if team and t.pk == team.pk %}bg-black text-white{% else %}text-neutral-600 hover:bg-neutral-100{% endif %}">{{ t.name }}</a>
      {% endfor %}
    </div>
    {% endif %}
    <div class="ml-auto flex items-center gap-2 shrink-0">
      <span class="eyebrow hidden sm:inline">Quarter</span>
      <form method="get" hx-boost="false">
        <select name="quarter" onchange="this.form.submit()" class="h-7 rounded-full border border-black/10 bg-white pl-3 pr-7 text-[13px] font-medium">
          {% for q in all_quarters %}<option value="{{ q.pk }}" {% if quarter and q.pk == quarter.pk %}selected{% endif %}>{{ q.name }}</option>{% endfor %}
        </select>
      </form>
    </div>
  </div>
</div>
