{% extends "base.html" %}
{% load static %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="rounded-2xl bg-black p-6 mb-4 text-center">
      <img src="{% static 'img/logo-light.svg' %}" alt="{{ COMPANY_NAME }}" class="h-8 mx-auto">
      <div class="mt-3 font-display text-[11px] font-bold uppercase tracking-[0.22em] text-bolt">{{ APP_NAME }}</div>
    </div>
    <div class="card p-6">{% block auth %}{% endblock %}</div>
  </div>
</div>
{% endblock %}
