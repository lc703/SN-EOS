<form method="post" action="{% url 'issue_new' %}" class="flex flex-wrap items-center gap-2 px-4 py-3 bg-neutral-50/70">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <input type="hidden" name="horizon" value="{{ horizon|default:'short' }}">
  {% if meeting %}<input type="hidden" name="meeting" value="{{ meeting.pk }}">{% endif %}
  <input name="title" required placeholder="Add an issue…" aria-label="New issue" class="flex-1 min-w-[14rem] rounded-lg border bg-white px-3 py-2 text-[15px]">
  <select name="owner" class="rounded-lg border bg-white px-2 py-2 text-sm" aria-label="Owner">
    {% for p in people %}<option value="{{ p.pk }}" {% if p.pk == user.pk %}selected{% endif %}>{{ p.display_name }}</option>{% endfor %}
  </select>
  <button class="btn btn-primary h-10">Add</button>
</form>
