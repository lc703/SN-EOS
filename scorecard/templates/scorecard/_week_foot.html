<td id="wk-{{ s.week|date:'Ymd' }}" class="px-1 py-2 text-center" {% if oob %}hx-swap-oob="true"{% endif %}>{% if s.scored %}<span class="inline-flex items-center justify-center min-w-[2.6rem] h-5 px-1.5 rounded-full text-[10.5px] font-bold {% if s.pct >= 80 %}bg-[var(--green-bg)] text-[var(--green-ink)]{% elif s.pct >= 50 %}bg-[var(--yellow-bg)] text-[var(--yellow-ink)]{% else %}bg-[var(--red-bg)] text-[var(--red-ink)]{% endif %}" title="{{ s.on }} of {{ s.scored }} on goal">{{ s.on }}/{{ s.scored }}</span>{% else %}<span class="text-neutral-300">·</span>{% endif %}</td>
